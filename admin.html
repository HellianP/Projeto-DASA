<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel da Oficina | DASA Centro Automotivo - Gestão de Serviços & Peças</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Folhas de Estilo -->
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>

  <div class="admin-layout">
    <!-- ====================================================================
         1. SIDEBAR ADMINISTRATIVA
         ==================================================================== -->
    <aside class="admin-sidebar" style="background: var(--color-azul-escuro);">
      <div class="admin-sidebar-header" style="border-bottom-color: rgba(255,255,255,0.15);">
        <img src="assets/img/logo-dasa.png" alt="DASA Logo" style="height: 36px; width: auto; background: #fff; padding: 3px 6px; border-radius: 6px;">
        <div>
          <div class="admin-sidebar-title" style="color: #fff;">DASA Auto</div>
          <span style="font-size: 0.72rem; color: #94a3b8;">Gestão da Oficina</span>
        </div>
      </div>

      <nav class="admin-sidebar-nav">
        <button type="button" class="admin-nav-item active" data-tab="dashboard">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
          Dashboard
        </button>

        <button type="button" class="admin-nav-item" data-tab="obras">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <circle cx="8.5" cy="8.5" r="1.5"></circle>
            <polyline points="21 15 16 10 5 21"></polyline>
          </svg>
          Serviços (Antes/Depois)
        </button>

        <button type="button" class="admin-nav-item" data-tab="servicos">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
          </svg>
          Serviços e Preços
        </button>

        <button type="button" class="admin-nav-item" data-tab="depoimentos">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
          </svg>
          Avaliações de Clientes
        </button>

        <button type="button" class="admin-nav-item" data-tab="agendamentos">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          Agendamentos
        </button>

        <button type="button" class="admin-nav-item" data-tab="informacoes">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
          Dados da Oficina
        </button>
      </nav>

      <div class="admin-sidebar-footer" style="border-top-color: rgba(255,255,255,0.15);">
        <a href="index.html" class="btn-view-site" style="background: rgba(255,255,255,0.1); color: #fff;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
          </svg>
          Visualizar Site da DASA
        </a>
      </div>
    </aside>

    <!-- ====================================================================
         2. ÁREA DE CONTEÚDO PRINCIPAL
         ==================================================================== -->
    <main class="admin-main">
      <header class="admin-topbar">
        <div style="display: flex; align-items: center; gap: 1rem;">
          <button type="button" class="btn btn-outline btn-sm" id="admin-sidebar-toggle" style="display: none;">
            ☰
          </button>
          <h1 class="admin-topbar-title" id="admin-page-title">Dashboard</h1>
        </div>

        <div style="display: flex; align-items: center; gap: 1rem;">
          <span class="badge" style="background: rgba(22, 163, 74, 0.15); color: #16a34a; font-weight: 700;">● Sistema Ativo</span>
          <div style="font-size: 0.875rem; font-weight: 700; color: var(--color-azul-escuro);">
            DASA Centro Automotivo
          </div>
        </div>
      </header>

      <div class="admin-content-body" id="admin-tab-content">
        <!-- Renderizado dinamicamente via admin.js -->
      </div>
    </main>
  </div>

  <!-- ====================================================================
       3. MODAL DE EDIÇÃO / ADIÇÃO
       ==================================================================== -->
  <div class="admin-modal-backdrop" id="admin-modal-backdrop">
    <div class="admin-modal">
      <div class="admin-modal-header">
        <h3 style="font-size: 1.15rem; color: var(--color-primary);" id="admin-modal-title">Título do Modal</h3>
        <button type="button" id="admin-modal-close" style="font-size: 1.25rem; color: var(--color-text-muted);">&times;</button>
      </div>

      <div class="admin-modal-body" id="admin-modal-body">
        <!-- Campos dinâmicos inseridos via admin.js -->
      </div>

      <div class="admin-modal-footer">
        <button type="button" class="btn btn-outline btn-sm" id="admin-modal-cancel">Cancelar</button>
        <button type="button" class="btn btn-sm" id="admin-modal-save" style="background: var(--color-vermelho); color: #fff;">Salvar Alterações</button>
      </div>
    </div>
  </div>

  <!-- Toast de Notificação -->
  <div class="toast-notice" id="admin-toast"></div>

  <!-- Script Modular do Painel Admin -->
  <script type="module" src="assets/js/admin.js"></script>
</body>
</html>
